<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeaveLedger</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><span>LEAVELEDGER</span><h1>Time off, without the spreadsheet.</h1></header><section id="auth"><h2>Create a leave workspace</h2><form id="register"><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Create workspace</button></form><hr><form id="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="ghost">Sign in</button></form></section><section id="dashboard" class="hidden"><div class="bar"><h2>Leave requests</h2><button id="logout" class="ghost">Log out</button></div><div id="stats" class="stats"></div><div class="columns"><form id="newRequest"><input name="employee_name" placeholder="Employee name" required><input name="employee_email" type="email" placeholder="Employee email" required><select name="leave_type"><option>annual</option><option>sick</option><option>unpaid</option></select><input name="start_date" type="date" required><input name="end_date" type="date" required><input name="reason" placeholder="Reason" required><button>Submit request</button></form><div id="items"></div></div></section><p id="message"></p></main><script src="/static/app.js"></script></body></html>
