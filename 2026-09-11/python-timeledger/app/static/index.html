<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TimeLedger</title><style>
:root{font-family:Inter,system-ui;color:#22273a;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#283260;color:white;padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}header h1{margin:0}button{background:#5269d8;color:white;border:0;font-weight:700;cursor:pointer}header button{width:auto;background:#d9e0ff;color:#283260}main{max-width:1120px;margin:30px auto;padding:0 20px}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px}.panel,article{background:white;padding:18px;border-radius:15px;box-shadow:0 8px 28px #28326010}input,select,button{width:100%;padding:10px;margin:5px 0;border:1px solid #d7dbea;border-radius:8px;font:inherit}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stats span{background:white;border-radius:12px;padding:15px}.stats b{display:block;font-size:1.4rem}.project{margin-bottom:14px}.project h3{margin:0}.top,.entry{display:flex;justify-content:space-between;gap:12px}.entry{border-top:1px solid #eaecf3;padding:10px 0}.entry small{display:block;color:#697085}.actions{display:flex;gap:5px}.actions button{width:auto;padding:7px}.reject{background:#aa3c50}.pill{background:#e6eaff;padding:4px 8px;border-radius:20px;font-size:.75rem}.auth{max-width:430px;margin:10vh auto}.link{background:none;color:#5269d8}.error{color:#aa3c50}@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.entry{flex-direction:column}}
</style></head><body><div id="app"></div><script>
const root=document.querySelector('#app');let token=localStorage.timeledger||'',mode='register';const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n/100);async function api(path,opt={}){let r=await fetch('/api'+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}),d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}function auth(){root.innerHTML=`<main class="auth panel"><h1>TimeLedger</h1><p>Approve hours and understand billable value.</p><form id="auth">${mode==='register'?'<input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required>':''}<input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>${mode==='register'?'Create workspace':'Sign in'}</button></form><button id="switch" class="link">${mode==='register'?'Use an existing account':'Create a workspace'}</button><p id="error" class="error"></p></main>`;document.querySelector('#switch').onclick=()=>{mode=mode==='register'?'login':'register';auth()};document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();try{let d=await api('/auth/'+mode,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.timeledger=token;dashboard()}catch(x){document.querySelector('#error').textContent=x.message}}}async function dashboard(){if(!token)return auth();try{let d=await api('/dashboard');root.innerHTML=`<header><div><h1>TimeLedger</h1><small>Timesheet approval workspace</small></div><button id="out">Sign out</button></header><main><div class="stats"><span>Awaiting approval<b>${d.summary.submitted_hours} h</b></span><span>Approved hours<b>${d.summary.approved_hours} h</b></span><span>Approved billable value<b>${money(d.summary.approved_billable_cents)}</b></span></div><div class="layout"><form class="panel" id="project"><h2>Add project</h2><input name="name" placeholder="Project name" required><input name="client" placeholder="Client" required><input name="rate" type="number" min="0" step="0.01" placeholder="Hourly rate" required><input name="budget_hours" type="number" min="0.1" step="0.1" placeholder="Budget hours" required><button>Add project</button></form><section>${d.projects.map(p=>`<article class="project"><div class="top"><div><h3>${p.name}</h3><small>${p.client} · ${p.approved_hours}/${p.budget_hours} h approved</small></div><span class="pill">${p.budget_used_percent}% used</span></div>${p.entries.map(e=>`<div class="entry"><span><b>${e.task}</b><small>${e.worked_on} · ${e.hours} h · ${e.billable?'billable':'non-billable'} · ${e.status}</small></span>${e.status==='submitted'?`<div class="actions"><button data-id="${e.id}" data-status="approved">Approve</button><button class="reject" data-id="${e.id}" data-status="rejected">Reject</button></div>`:''}</div>`).join('')}<form class="entryForm" data-id="${p.id}"><input name="worked_on" type="date" required><input name="hours" type="number" min="0.1" max="24" step="0.1" placeholder="Hours" required><input name="task" placeholder="Work performed" required><select name="billable"><option value="true">billable</option><option value="false">non-billable</option></select><button>Submit time</button></form></article>`).join('')||'<article>No projects yet.</article>'}</section></div><p id="error" class="error"></p></main>`;document.querySelector('#out').onclick=()=>{localStorage.removeItem('timeledger');token='';auth()};document.querySelector('#project').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.hourly_rate_cents=Math.round(Number(b.rate)*100);b.budget_hours=Number(b.budget_hours);delete b.rate;try{await api('/projects',{method:'POST',body:JSON.stringify(b)});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}};document.querySelectorAll('.entryForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(f));b.hours=Number(b.hours);b.billable=b.billable==='true';try{await api('/projects/'+f.dataset.id+'/entries',{method:'POST',body:JSON.stringify(b)});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{let note=prompt('Review note');if(!note)return;try{await api('/entries/'+b.dataset.id+'/review',{method:'PATCH',body:JSON.stringify({status:b.dataset.status,review_note:note})});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}})}catch(x){localStorage.removeItem('timeledger');token='';auth()}}dashboard();
</script></body></html>
