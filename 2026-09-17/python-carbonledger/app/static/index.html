<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonLedger</title><style>:root{font-family:Inter,system-ui;color:#20352e;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}header{background:#174c3a;color:white;padding:1rem 5%;display:flex;justify-content:space-between}main{max-width:1050px;margin:auto;padding:2rem 1rem}.card{background:white;padding:1.1rem;border-radius:14px;box-shadow:0 5px 20px #17352a12}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.metrics b{display:block;font-size:1.7rem}.muted{color:#65786f}form{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0}input,select,textarea,button{font:inherit;padding:.72rem;border:1px solid #c8d6d0;border-radius:8px}textarea,form button{grid-column:1/-1}button{background:#27845f;color:white;border:0}.hidden{display:none}.list{display:grid;gap:.7rem}.row{display:flex;justify-content:space-between;gap:1rem}.error{color:#b42318}@media(max-width:650px){.metrics,form{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><header><b>CarbonLedger</b><button id="logout" class="hidden">Log out</button></header><main><section id="auth" class="card"><h1>Measure emissions. Make reductions visible.</h1><form id="authForm"><input name="organization" placeholder="Organization"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><input name="target" type="number" min="0" placeholder="Annual target kg CO2e"><select name="mode"><option value="register">Create account</option><option value="login">Sign in</option></select><button>Continue</button></form></section><section id="work" class="hidden"><div id="metrics" class="metrics"></div><form id="activityForm" class="card"><input name="date" type="date" required><select name="category"><option>energy</option><option>travel</option><option>freight</option><option>materials</option><option>waste</option><option>other</option></select><input name="source" placeholder="Activity source" required><input name="quantity" type="number" min="0.001" step="any" placeholder="Quantity" required><input name="unit" placeholder="Unit (kWh, km, kg)" required><input name="factor" type="number" min="0.0001" step="any" placeholder="kg CO2e per unit" required><textarea name="notes" placeholder="Evidence or notes"></textarea><button>Add activity</button></form><p id="error" class="error"></p><div id="list" class="list"></div></section></main><script>const $=s=>document.querySelector(s),tok=()=>localStorage.clToken,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){let r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(tok()?{Authorization:`Bearer ${tok()}`}:{})}}),d=r.status===204?null:await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');return d}async function load(){try{let[a,m]=await Promise.all([api('/api/activities'),api('/api/dashboard')]);$('#metrics').innerHTML=[['Emissions',m.total_kg_co2e+' kg'],['Annual target',m.target_kg+' kg'],['Remaining',m.remaining_kg+' kg']].map(x=>`<div class="card"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#list').innerHTML=a.map(x=>`<article class="card row"><div><b>${esc(x.source)}</b><div class="muted">${esc(x.category)} · ${x.activity_date}</div></div><div><b>${x.kg_co2e} kg CO2e</b><div class="muted">${x.quantity} ${esc(x.unit)} × ${x.factor}</div></div></article>`).join('')||'<div class="card muted">No activities yet.</div>';$('#error').textContent=''}catch(x){$('#error').textContent=x.message}}function show(){let on=!!tok();$('#auth').classList.toggle('hidden',on);$('#work').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on);if(on)load()}show();$('#authForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b={email:f.get('email'),password:f.get('password')};if(f.get('mode')==='register'){b.organization=f.get('organization');b.annual_target_kg=Number(f.get('target')||0)}try{let d=await api('/api/auth/'+f.get('mode'),{method:'POST',body:JSON.stringify(b)});localStorage.clToken=d.access_token;show()}catch(x){alert(x.message)}};$('#activityForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/activities',{method:'POST',body:JSON.stringify({activity_date:f.get('date'),category:f.get('category'),source:f.get('source'),quantity:Number(f.get('quantity')),unit:f.get('unit'),factor:Number(f.get('factor')),notes:f.get('notes')})});e.target.reset();load()}catch(x){$('#error').textContent=x.message}};$('#logout').onclick=()=>{delete localStorage.clToken;show()}</script></body></html>
