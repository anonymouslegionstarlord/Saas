<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PolicyPulse</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><span>POLICYPULSE</span><h1>Compliance people can actually follow.</h1></header><section id="auth"><h2>Create a policy workspace</h2><form id="register"><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Create workspace</button></form><hr><form id="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="ghost">Sign in</button></form></section><section id="dashboard" class="hidden"><div class="bar"><h2>Policy library</h2><button id="logout" class="ghost">Log out</button></div><div class="columns"><form id="newPolicy"><input name="title" placeholder="Policy title" required><input name="version" placeholder="Version, e.g. 1.0" required><textarea name="content" minlength="20" placeholder="Policy content" required></textarea><button>Publish policy</button></form><div id="items"></div></div></section><p id="message"></p></main><script src="/static/app.js"></script></body></html>
