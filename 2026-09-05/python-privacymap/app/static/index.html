<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrivacyMap</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f7f6;color:#1e302b}header{background:#173f36;color:white;padding:24px 5vw}main{max-width:1100px;margin:auto;padding:26px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.layout{display:grid;grid-template-columns:310px 1fr;gap:24px;align-items:start}form,.card,.stat{background:white;border:1px solid #d8e3df;border-radius:14px;padding:18px;box-shadow:0 6px 20px #173f360c}input,select,textarea,button{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #bacbc5;border-radius:8px}button{border:0;background:#25806a;color:white;font-weight:700}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{min-width:140px}.stat b{font-size:24px}.hidden{display:none}.pill{background:#ddf1eb;padding:4px 8px;border-radius:99px}.muted{color:#65766f}.error{color:#b42318}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><header><h1>PrivacyMap</h1><div>Know what data you hold and why.</div></header><main><section id="auth"><div class="grid"><form id="register"><h2>Create workspace</h2><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Build data map</button></form><form id="login"><h2>Sign in</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></div></section><section id="workspace" class="hidden"><div id="stats" class="stats"></div><div class="layout"><form id="activity"><h2>Add processing activity</h2><input name="name" placeholder="Activity name" required><input name="owner" placeholder="Owner" required><textarea name="purpose" placeholder="Purpose" required></textarea><select name="lawful_basis"><option value="consent">Consent</option><option value="contract">Contract</option><option value="legal_obligation">Legal obligation</option><option value="legitimate_interest">Legitimate interest</option></select><input name="data_subjects" placeholder="Data subjects" required><input name="retention_days" type="number" min="1" value="365" required><input name="review_due" type="date" required><select name="risk"><option>low</option><option>medium</option><option>high</option></select><button>Add activity</button></form><section><h2>Processing register</h2><div id="activities" class="grid"></div></section></div></section><p id="message" class="error"></p></main><script>
let token=localStorage.privacymap||'';async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){if(!token)return;try{const d=await api('/api/dashboard');auth.classList.add('hidden');workspace.classList.remove('hidden');stats.innerHTML=[['Activities',d.summary.total],['High risk',d.summary.high_risk],['Reviews due',d.summary.reviews_due]].map(x=>'<div class="stat"><b>'+x[1]+'</b><div class="muted">'+x[0]+'</div></div>').join('');activities.innerHTML=d.activities.map(a=>'<article class="card"><span class="pill">'+a.risk+' risk</span><h3>'+a.name+'</h3><p>'+a.purpose+'</p><small>'+a.lawful_basis+' · retain '+a.retention_days+' days</small><p>'+a.data_item_count+' data categories / '+(a.sensitive_count||0)+' sensitive</p></article>').join('')||'<p class="muted">Add your first processing activity.</p>'}catch(e){message.textContent=e.message;localStorage.removeItem('privacymap')}}for(const id of ['register','login'])document.getElementById(id).onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/'+id,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.privacymap=token;load()}catch(x){message.textContent=x.message}};activity.onsubmit=async e=>{e.preventDefault();try{const b=Object.fromEntries(new FormData(e.target));b.retention_days=Number(b.retention_days);await api('/api/activities',{method:'POST',body:JSON.stringify(b)});e.target.reset();load()}catch(x){message.textContent=x.message}};load();
</script></body></html>
