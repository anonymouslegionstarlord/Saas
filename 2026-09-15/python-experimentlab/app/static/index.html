<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExperimentLab</title><style>:root{font-family:Inter,system-ui;color:#17233d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#0e4166;color:white;padding:1rem 5%;display:flex;justify-content:space-between}main{max-width:1050px;margin:auto;padding:2rem 1rem}.card{background:white;padding:1.1rem;border-radius:14px;box-shadow:0 5px 20px #17233d12}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.metrics b{display:block;font-size:1.7rem}.muted{color:#69758a}form{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0}input,select,textarea,button{font:inherit;padding:.72rem;border:1px solid #cbd4df;border-radius:8px}textarea,form button{grid-column:1/-1}button{background:#1676a7;color:white;border:0}.hidden{display:none}.list{display:grid;gap:.7rem}.row{display:flex;justify-content:space-between}.error{color:#b42318}@media(max-width:650px){.metrics,form{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><header><b>ExperimentLab</b><button id="logout" class="hidden">Log out</button></header><main><section id="auth" class="card"><h1>Learn faster from every product change.</h1><form id="authForm"><input name="organization" placeholder="Organization"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><select name="mode"><option value="register">Create account</option><option value="login">Sign in</option></select><button>Continue</button></form></section><section id="workspace" class="hidden"><div id="metrics" class="metrics"></div><form id="experimentForm" class="card"><input name="name" placeholder="Experiment name" required><input name="metric" placeholder="Primary metric" required><input name="target" type="number" min="0.1" step="0.1" placeholder="Target lift %" required><input name="start" type="date" required><input name="end" type="date" required><select name="status"><option>draft</option><option>running</option></select><textarea name="hypothesis" placeholder="Hypothesis" required></textarea><textarea name="notes" placeholder="Notes"></textarea><button>Add experiment</button></form><p id="error" class="error"></p><div id="list" class="list"></div></section></main><script>const $=s=>document.querySelector(s),tok=()=>localStorage.elToken,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){let r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(tok()?{Authorization:`Bearer ${tok()}`}:{})}}),d=r.status===204?null:await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');return d}async function load(){try{let[e,m]=await Promise.all([api('/api/experiments'),api('/api/dashboard')]);$('#metrics').innerHTML=[['Experiments',m.total],['Running',m.running],['Wins',m.wins],['Avg. lift',m.average_lift+'%']].map(x=>`<div class="card"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#list').innerHTML=e.map(x=>`<article class="card row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.hypothesis)}</div></div><div>${esc(x.status)} · ${esc(x.primary_metric)}<div class="muted">${x.starts_on} → ${x.ends_on}</div></div></article>`).join('')||'<div class="card muted">No experiments yet.</div>';$('#error').textContent=''}catch(x){$('#error').textContent=x.message}}function show(){let on=!!tok();$('#auth').classList.toggle('hidden',on);$('#workspace').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on);if(on)load()}show();$('#authForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b={email:f.get('email'),password:f.get('password')};if(f.get('mode')==='register')b.organization=f.get('organization');try{let d=await api('/api/auth/'+f.get('mode'),{method:'POST',body:JSON.stringify(b)});localStorage.elToken=d.access_token;show()}catch(x){alert(x.message)}};$('#experimentForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/experiments',{method:'POST',body:JSON.stringify({name:f.get('name'),hypothesis:f.get('hypothesis'),primary_metric:f.get('metric'),target_lift:Number(f.get('target')),starts_on:f.get('start'),ends_on:f.get('end'),status:f.get('status'),notes:f.get('notes')})});e.target.reset();load()}catch(x){$('#error').textContent=x.message}};$('#logout').onclick=()=>{delete localStorage.elToken;show()}</script></body></html>
