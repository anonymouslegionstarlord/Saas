<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FeedbackForge</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><span>FEEDBACKFORGE</span><h1>Turn customer signals into a roadmap.</h1></header><section id="auth"><h2>Start a feedback workspace</h2><form id="register"><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Create workspace</button></form><p>Already registered?</p><form id="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="alt">Sign in</button></form></section><section id="app" class="hidden"><div class="bar"><div><h2>Feedback inbox</h2><p id="board"></p></div><button id="logout" class="alt">Log out</button></div><div id="cards" class="grid"></div></section><p id="message"></p></main><script src="/static/app.js"></script></body></html>
