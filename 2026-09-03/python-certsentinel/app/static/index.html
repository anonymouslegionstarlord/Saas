<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CertSentinel</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f7f5f1;color:#2e2921}header{background:#56341f;color:white;padding:24px 5vw}main{max-width:1100px;margin:auto;padding:26px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}form,.card,.stat{background:white;border:1px solid #e1d8ce;border-radius:14px;padding:18px;box-shadow:0 6px 20px #422b1a0c}input,button{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #c9baaa;border-radius:8px}button{border:0;background:#9b552c;color:white;font-weight:700}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{min-width:140px}.stat b{font-size:24px}.hidden{display:none}.pill{background:#fae9d8;padding:4px 8px;border-radius:99px}.muted{color:#75695e}.error{color:#b42318}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><header><h1>CertSentinel</h1><div>Keep every credential current.</div></header><main>
<section id="auth"><div class="grid"><form id="register"><h2>Create workspace</h2><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Start tracking</button></form><form id="login"><h2>Sign in</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></div></section>
<section id="workspace" class="hidden"><div class="stats" id="stats"></div><div class="layout"><form id="person"><h2>Add team member</h2><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="department" placeholder="Department" required><button>Add person</button></form><section><h2>Credential register</h2><div class="grid" id="credentials"></div></section></div></section><p class="error" id="message"></p></main><script>
let token=localStorage.certsentinel||'';async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function load(){if(!token)return;try{const d=await api('/api/dashboard');auth.classList.add('hidden');workspace.classList.remove('hidden');stats.innerHTML=[['Credentials',d.summary.total],['Expiring in 30 days',d.summary.expiring],['Expired',d.summary.expired]].map(x=>'<div class="stat"><b>'+x[1]+'</b><div class="muted">'+x[0]+'</div></div>').join('');credentials.innerHTML=d.credentials.map(c=>'<article class="card"><span class="pill">'+c.status+'</span><h3>'+c.certification+'</h3><p>'+c.person_name+' / '+c.department+'</p><small>'+c.issuer+' · expires '+c.expires_on+'</small><p>'+c.days_left+' days remaining</p></article>').join('')||'<p class="muted">Add a person, then use the API docs to assign a certification.</p>'}catch(e){message.textContent=e.message;localStorage.removeItem('certsentinel')}}
for(const id of ['register','login'])document.getElementById(id).onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/'+id,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.certsentinel=token;load()}catch(x){message.textContent=x.message}};
person.onsubmit=async e=>{e.preventDefault();try{await api('/api/people',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()}catch(x){message.textContent=x.message}};load();
</script></body></html>
