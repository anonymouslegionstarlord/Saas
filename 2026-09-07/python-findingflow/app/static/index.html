<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FindingFlow</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f6f5f8;color:#29253a}header{background:#3e315b;color:white;padding:24px 5vw}main{max-width:1100px;margin:auto;padding:26px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.layout{display:grid;grid-template-columns:310px 1fr;gap:24px;align-items:start}form,.card,.stat{background:white;border:1px solid #e0dce7;border-radius:14px;padding:18px;box-shadow:0 6px 20px #34284e0c}input,button{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #c4bdd1;border-radius:8px}button{border:0;background:#7558a6;color:white;font-weight:700}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{min-width:140px}.stat b{font-size:24px}.hidden{display:none}.pill{background:#eee8f7;padding:4px 8px;border-radius:99px}.muted{color:#70697d}.error{color:#b42318}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><header><h1>FindingFlow</h1><div>Turn audit findings into verified fixes.</div></header><main><section id="auth"><div class="grid"><form id="register"><h2>Create workspace</h2><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Start auditing</button></form><form id="login"><h2>Sign in</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></div></section><section id="workspace" class="hidden"><div id="stats" class="stats"></div><div class="layout"><form id="audit"><h2>New audit</h2><input name="title" placeholder="Audit title" required><input name="area" placeholder="Business area" required><input name="lead" placeholder="Audit lead" required><label>Starts</label><input name="starts_on" type="date" required><label>Ends</label><input name="ends_on" type="date" required><button>Create audit</button></form><section><h2>Audit register</h2><div id="audits" class="grid"></div></section></div></section><p id="message" class="error"></p></main><script>
let token=localStorage.findingflow||'';async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){if(!token)return;try{const d=await api('/api/dashboard');auth.classList.add('hidden');workspace.classList.remove('hidden');stats.innerHTML=[['Open findings',d.summary.open],['Critical',d.summary.critical],['Overdue',d.summary.overdue]].map(x=>'<div class="stat"><b>'+x[1]+'</b><div class="muted">'+x[0]+'</div></div>').join('');audits.innerHTML=d.audits.map(a=>'<article class="card"><span class="pill">'+a.status+'</span><h3>'+a.title+'</h3><p>'+a.area+' · '+a.lead+'</p><small>'+a.starts_on+' to '+a.ends_on+'</small><p>'+a.finding_count+' findings / '+(a.open_findings||0)+' open</p></article>').join('')||'<p class="muted">Create your first audit.</p>'}catch(e){message.textContent=e.message;localStorage.removeItem('findingflow')}}for(const id of ['register','login'])document.getElementById(id).onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/'+id,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.findingflow=token;load()}catch(x){message.textContent=x.message}};audit.onsubmit=async e=>{e.preventDefault();try{await api('/api/audits',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()}catch(x){message.textContent=x.message}};load();
</script></body></html>
