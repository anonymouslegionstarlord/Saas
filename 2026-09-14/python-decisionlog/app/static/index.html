<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DecisionLog</title><style>:root{font-family:Inter,system-ui;color:#25324a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#192b55;color:white;padding:1rem 5%;display:flex;justify-content:space-between}main{max-width:1050px;margin:auto;padding:2rem 1rem}.card{background:white;border-radius:14px;padding:1.1rem;box-shadow:0 5px 20px #20325812}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}form{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0}input,select,textarea,button{font:inherit;padding:.7rem;border:1px solid #ccd3df;border-radius:8px}textarea,form button{grid-column:1/-1}button{background:#345fcc;color:white;border:0}.hidden{display:none}.metric b{display:block;font-size:1.7rem}.muted{color:#6a7486}.list{display:grid;gap:.7rem}.row{display:flex;justify-content:space-between;gap:1rem}.error{color:#b42318}@media(max-width:650px){.grid,form{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><header><strong>DecisionLog</strong><button id="logout" class="hidden">Log out</button></header><main><section id="auth" class="card"><h1>Keep decisions clear and accountable.</h1><form id="authForm"><input name="organization" placeholder="Organization"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><select name="mode"><option value="register">Create account</option><option value="login">Sign in</option></select><button>Continue</button></form></section><section id="workspace" class="hidden"><div id="metrics" class="grid"></div><form id="meetingForm" class="card"><input name="title" placeholder="Meeting title" required><input name="held_on" type="date" required><input name="facilitator" placeholder="Facilitator" required><textarea name="notes" placeholder="Meeting notes"></textarea><button>Add meeting</button></form><form id="decisionForm" class="card"><select name="meeting_id" id="meetingSelect" required></select><input name="summary" placeholder="Decision or action" required><input name="owner" placeholder="Owner" required><input name="due_date" type="date"><textarea name="rationale" placeholder="Rationale"></textarea><button>Add action</button></form><p class="error" id="error"></p><div id="list" class="list"></div></section></main><script>const $=s=>document.querySelector(s),token=()=>localStorage.dlToken;async function api(path,o={}){const r=await fetch(path,{...o,headers:{'Content-Type':'application/json',...(token()?{Authorization:`Bearer ${token()}`}:{})}}),d=r.status===204?null:await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');return d}async function load(){try{const[m,d,k]=await Promise.all([api('/api/meetings'),api('/api/decisions'),api('/api/dashboard')]);$('#metrics').innerHTML=[['Decisions',k.total],['Completed',k.completed],['Overdue',k.overdue]].map(x=>`<div class="card metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#meetingSelect').innerHTML='<option value="">Select meeting</option>'+m.map(x=>`<option value="${x.id}">${x.title}</option>`).join('');$('#list').innerHTML=d.map(x=>`<article class="card row"><div><b>${x.summary}</b><div class="muted">${x.meeting_title} · ${x.owner}</div></div><span>${x.status}${x.due_date?' · '+x.due_date:''}</span></article>`).join('')||'<div class="card muted">No decisions yet.</div>'}catch(e){$('#error').textContent=e.message}}function show(){let on=!!token();$('#auth').classList.toggle('hidden',on);$('#workspace').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on);if(on)load()}show();$('#authForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),body={email:f.get('email'),password:f.get('password')};if(f.get('mode')==='register')body.organization=f.get('organization');try{let d=await api('/api/auth/'+f.get('mode'),{method:'POST',body:JSON.stringify(body)});localStorage.dlToken=d.access_token;show()}catch(x){alert(x.message)}};$('#meetingForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/meetings',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});e.target.reset();load()}catch(x){$('#error').textContent=x.message}};$('#decisionForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b=Object.fromEntries(f);b.meeting_id=Number(b.meeting_id);b.due_date=b.due_date||null;b.status='open';try{await api('/api/decisions',{method:'POST',body:JSON.stringify(b)});e.target.reset();load()}catch(x){$('#error').textContent=x.message}};$('#logout').onclick=()=>{delete localStorage.dlToken;show()}</script></body></html>
