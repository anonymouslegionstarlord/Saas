<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IncidentAtlas</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><span>INCIDENTATLAS</span><h1>Clear updates when systems go sideways.</h1></header><section id="auth"><h2>Create an incident workspace</h2><form id="register"><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Create workspace</button></form><hr><form id="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="ghost">Sign in</button></form></section><section id="dashboard" class="hidden"><div class="bar"><div><h2>Incident command</h2><p id="statusKey"></p></div><button id="logout" class="ghost">Log out</button></div><div class="columns"><form id="newIncident"><input name="title" placeholder="Incident title" required><select name="severity"><option>minor</option><option>major</option><option>critical</option></select><textarea name="summary" minlength="10" placeholder="What is happening?" required></textarea><button>Declare incident</button></form><div id="items"></div></div></section><p id="message"></p></main><script src="/static/app.js"></script></body></html>
