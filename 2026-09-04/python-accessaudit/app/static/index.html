<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AccessAudit</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f4f6fa;color:#19243b}header{background:#252c58;color:white;padding:24px 5vw}main{max-width:1100px;margin:auto;padding:26px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}form,.card,.stat{background:white;border:1px solid #dbe0eb;border-radius:14px;padding:18px;box-shadow:0 6px 20px #252c580c}input,select,button{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #bec5d6;border-radius:8px}button{border:0;background:#5965c7;color:white;font-weight:700}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.stat{min-width:140px}.stat b{font-size:24px}.hidden{display:none}.pill{background:#e8eaff;padding:4px 8px;border-radius:99px}.muted{color:#68718a}.error{color:#b42318}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><header><h1>AccessAudit</h1><div>Review every permission with evidence.</div></header><main><section id="auth"><div class="grid"><form id="register"><h2>Create workspace</h2><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Start reviews</button></form><form id="login"><h2>Sign in</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></div></section><section id="workspace" class="hidden"><div id="stats" class="stats"></div><div class="layout"><form id="system"><h2>Add system</h2><input name="name" placeholder="System name" required><input name="owner" placeholder="System owner" required><select name="risk"><option>low</option><option>medium</option><option>high</option></select><button>Add system</button></form><section><h2>Review register</h2><div id="systems" class="grid"></div></section></div></section><p id="message" class="error"></p></main><script>
let token=localStorage.accessaudit||'';async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function load(){if(!token)return;try{const d=await api('/api/dashboard');auth.classList.add('hidden');workspace.classList.remove('hidden');stats.innerHTML=[['Pending',d.summary.pending],['Overdue',d.summary.overdue],['High-risk systems',d.summary.high_risk]].map(x=>'<div class="stat"><b>'+x[1]+'</b><div class="muted">'+x[0]+'</div></div>').join('');systems.innerHTML=d.systems.map(s=>'<article class="card"><span class="pill">'+s.risk+' risk</span><h3>'+s.name+'</h3><p>Owner: '+s.owner+'</p><small>'+s.grant_count+' grants / '+(s.pending||0)+' pending</small></article>').join('')||'<p class="muted">Add your first system.</p>'}catch(e){message.textContent=e.message;localStorage.removeItem('accessaudit')}}
for(const id of ['register','login'])document.getElementById(id).onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/'+id,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.accessaudit=token;load()}catch(x){message.textContent=x.message}};
system.onsubmit=async e=>{e.preventDefault();try{await api('/api/systems',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()}catch(x){message.textContent=x.message}};load();
</script></body></html>
