<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendorWatch</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f7fb;color:#172033}header{background:#13213c;color:white;padding:22px max(5vw,20px)}main{max-width:1100px;margin:auto;padding:28px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card,form{background:white;border:1px solid #dce2ec;border-radius:14px;padding:18px;box-shadow:0 5px 20px #1b2f4d0d}input,select,textarea,button{width:100%;padding:11px;border:1px solid #bdc7d6;border-radius:8px;margin:5px 0 10px}button{background:#2864dc;color:white;border:0;font-weight:700;cursor:pointer}.muted{color:#68758a}.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{min-width:140px}.hidden{display:none}.badge{padding:4px 8px;border-radius:99px;background:#eaf0ff}.error{color:#b42318}@media(max-width:600px){header{padding:18px}main{padding:18px 12px}}
</style></head><body><header><h1>VendorWatch</h1><div>Know which suppliers deserve your trust.</div></header><main>
<section id="auth"><div class="grid"><form id="register"><h2>Create workspace</h2><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Start reviewing</button></form><form id="login"><h2>Sign in</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></div></section>
<section id="app" class="hidden"><div class="stats" id="stats"></div><h2>Vendor register</h2><div class="grid"><form id="vendor"><input name="name" placeholder="Vendor name" required><input name="service" placeholder="Service provided" required><input name="owner_email" type="email" placeholder="Owner email" required><select name="data_access"><option value="none">No data access</option><option value="internal">Internal data</option><option value="confidential">Confidential data</option></select><select name="criticality"><option value="low">Low criticality</option><option value="medium">Medium criticality</option><option value="high">High criticality</option></select><input name="next_review" type="date" required><textarea name="notes" placeholder="Review notes"></textarea><button>Add vendor</button></form><div id="vendors" class="grid"></div></div></section><p id="message" class="error"></p></main><script>
let token=localStorage.token||'';const request=async(path,options={})=>{const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');return data};
async function load(){if(!token)return;try{const d=await request('/api/dashboard');auth.classList.add('hidden');app.classList.remove('hidden');stats.innerHTML=`<div class="card stat"><b>${d.summary.total}</b><div class="muted">Vendors</div></div><div class="card stat"><b>${d.summary.high}</b><div class="muted">High criticality</div></div><div class="card stat"><b>${d.summary.due}</b><div class="muted">Reviews due</div></div>`;vendors.innerHTML=d.vendors.map(v=>`<article class="card"><span class="badge">${v.status}</span><h3>${v.name}</h3><p>${v.service}</p><small>${v.criticality} criticality · review ${v.next_review}</small><p>Assessment: ${v.risk_score??'not scored'}</p></article>`).join('')||'<p class="muted">Add your first supplier.</p>'}catch(e){localStorage.removeItem('token');token='';message.textContent=e.message}}
for(const id of ['register','login'])document.getElementById(id).onsubmit=async e=>{e.preventDefault();try{const body=Object.fromEntries(new FormData(e.target));const d=await request(`/api/auth/${id}`,{method:'POST',body:JSON.stringify(body)});token=d.token;localStorage.token=token;load()}catch(x){message.textContent=x.message}};
vendor.onsubmit=async e=>{e.preventDefault();try{const body=Object.fromEntries(new FormData(e.target));await request('/api/vendors',{method:'POST',body:JSON.stringify(body)});e.target.reset();load()}catch(x){message.textContent=x.message}};load();
</script></body></html>
