<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeterMind</title><style>
:root{font-family:Inter,system-ui;color:#172338;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#172a46;color:white;padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}header h1{margin:0}button{background:#1678c2;color:white;border:0;font-weight:700;cursor:pointer}header button{width:auto;background:#65e0bd;color:#172a46}main{max-width:1100px;margin:30px auto;padding:0 20px}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px}.panel,article{background:white;padding:18px;border-radius:15px;box-shadow:0 8px 28px #1d36520f}input,select,textarea,button{width:100%;padding:10px;margin:5px 0;border:1px solid #ced8e3;border-radius:8px;font:inherit}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stats span{background:white;border-radius:12px;padding:15px}.stats b{display:block;font-size:1.4rem}.meter{margin-bottom:14px}.meter h3{margin:0}.top,.reading{display:flex;justify-content:space-between;gap:12px}.reading{border-top:1px solid #e7edf3;padding:10px 0}.reading small{display:block;color:#657285}.alert{color:#b52d43;font-weight:700}.auth{max-width:430px;margin:10vh auto}.link{background:none;color:#1678c2}.error{color:#b52d43}@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const root=document.querySelector('#app');let token=localStorage.metermind||'',mode='register';async function api(path,opt={}){let r=await fetch('/api'+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}),d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}function auth(){root.innerHTML=`<main class="auth panel"><h1>MeterMind</h1><p>Spot unusual utility consumption before the bill arrives.</p><form id="auth">${mode==='register'?'<input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required>':''}<input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>${mode==='register'?'Create workspace':'Sign in'}</button></form><button id="switch" class="link">${mode==='register'?'Use an existing account':'Create a workspace'}</button><p id="error" class="error"></p></main>`;document.querySelector('#switch').onclick=()=>{mode=mode==='register'?'login':'register';auth()};document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();try{let d=await api('/auth/'+mode,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.metermind=token;dashboard()}catch(x){document.querySelector('#error').textContent=x.message}}}async function dashboard(){if(!token)return auth();try{let d=await api('/dashboard');root.innerHTML=`<header><div><h1>MeterMind</h1><small>Utility monitoring workspace</small></div><button id="out">Sign out</button></header><main><div class="stats"><span>Tracked meters<b>${d.summary.meters}</b></span><span>Usage alerts<b>${d.summary.anomalies}</b></span><span>Latest combined usage<b>${d.summary.latest_usage}</b></span></div><div class="layout"><form class="panel" id="meter"><h2>Add meter</h2><input name="name" placeholder="Meter name" required><input name="location" placeholder="Location" required><select name="unit"><option>kWh</option><option>litres</option><option>m3</option></select><input name="alert_percent" type="number" min="1" max="500" value="25" required><button>Add meter</button></form><section>${d.meters.map(m=>`<article class="meter"><div class="top"><div><h3>${m.name}</h3><small>${m.location} · ${m.unit}</small></div>${m.anomaly?'<span class="alert">Usage spike</span>':''}</div>${m.readings.slice(0,4).map(r=>`<div class="reading"><span>${r.reading_on}<small>${r.note||'No note'}</small></span><b>${r.value} ${m.unit}${r.usage===null?'':' · +'+r.usage}</b></div>`).join('')}<form class="readingForm" data-id="${m.id}"><input name="reading_on" type="date" required><input name="value" type="number" min="0" step="0.001" placeholder="Cumulative reading" required><input name="note" placeholder="Optional note"><button>Add reading</button></form></article>`).join('')||'<article>No meters yet.</article>'}</section></div><p id="error" class="error"></p></main>`;document.querySelector('#out').onclick=()=>{localStorage.removeItem('metermind');token='';auth()};document.querySelector('#meter').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.alert_percent=Number(b.alert_percent);try{await api('/meters',{method:'POST',body:JSON.stringify(b)});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}};document.querySelectorAll('.readingForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(f));b.value=Number(b.value);try{await api('/meters/'+f.dataset.id+'/readings',{method:'POST',body:JSON.stringify(b)});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}})}catch(x){localStorage.removeItem('metermind');token='';auth()}}dashboard();
</script></body></html>
