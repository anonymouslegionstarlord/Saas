<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RenewalRadar</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><span>RENEWALRADAR</span><h1>See every renewal before it hits.</h1></header><section id="auth"><h2>Create a spend workspace</h2><form id="register"><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Create workspace</button></form><hr><form id="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="ghost">Sign in</button></form></section><section id="dashboard" class="hidden"><div class="bar"><h2>Subscription portfolio</h2><button id="logout" class="ghost">Log out</button></div><div id="stats" class="stats"></div><div class="columns"><form id="newSub"><input name="vendor" placeholder="Vendor" required><input name="category" placeholder="Category" required><input name="cost" type="number" min="0" step=".01" placeholder="Cost" required><select name="billing_cycle"><option>monthly</option><option>quarterly</option><option>yearly</option></select><input name="renewal_date" type="date" required><input name="owner" placeholder="Owner" required><input name="notes" placeholder="Notes"><button>Add subscription</button></form><div id="items"></div></div></section><p id="message"></p></main><script src="/static/app.js"></script></body></html>
