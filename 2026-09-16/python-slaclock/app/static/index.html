<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLAClock</title><style>:root{font-family:Inter,system-ui;color:#202d3d;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#164650;color:white;padding:1rem 5%;display:flex;justify-content:space-between}main{max-width:1050px;margin:auto;padding:2rem 1rem}.card{background:white;padding:1.1rem;border-radius:14px;box-shadow:0 5px 20px #20303d12}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.metrics b{display:block;font-size:1.7rem}.muted{color:#687781}form{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0}input,select,textarea,button{font:inherit;padding:.72rem;border:1px solid #cbd5d7;border-radius:8px}textarea,form button{grid-column:1/-1}button{background:#1b7b78;color:white;border:0}.hidden{display:none}.list{display:grid;gap:.7rem}.row{display:flex;justify-content:space-between;gap:1rem}.error{color:#b42318}@media(max-width:650px){.metrics,form{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><header><b>SLAClock</b><button id="logout" class="hidden">Log out</button></header><main><section id="auth" class="card"><h1>Protect every support promise.</h1><form id="authForm"><input name="organization" placeholder="Organization"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><select name="mode"><option value="register">Create account</option><option value="login">Sign in</option></select><button>Continue</button></form></section><section id="work" class="hidden"><div id="metrics" class="metrics"></div><form id="ticketForm" class="card"><input name="subject" placeholder="Ticket subject" required><input name="customer" placeholder="Customer" required><input name="assignee" placeholder="Assignee" required><select name="priority"><option>low</option><option>medium</option><option>high</option><option>urgent</option></select><input name="opened" type="datetime-local" required><input name="due" type="datetime-local" required><textarea name="description" placeholder="Description"></textarea><button>Add ticket</button></form><p id="error" class="error"></p><div id="list" class="list"></div></section></main><script>const $=s=>document.querySelector(s),tok=()=>localStorage.slaToken,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){let r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(tok()?{Authorization:`Bearer ${tok()}`}:{})}}),d=r.status===204?null:await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');return d}async function load(){try{let[t,m]=await Promise.all([api('/api/tickets'),api('/api/dashboard')]);$('#metrics').innerHTML=[['Tickets',m.total],['Active',m.active],['Breached',m.breached],['Resolved in SLA',m.within_sla]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#list').innerHTML=t.map(x=>`<article class="card row"><div><b>${esc(x.subject)}</b><div class="muted">${esc(x.customer)} · ${esc(x.assignee)}</div></div><div>${esc(x.priority)} · ${esc(x.status)}<div class="muted">Due ${new Date(x.due_at).toLocaleString()}</div></div></article>`).join('')||'<div class="card muted">No tickets yet.</div>';$('#error').textContent=''}catch(x){$('#error').textContent=x.message}}function show(){let on=!!tok();$('#auth').classList.toggle('hidden',on);$('#work').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on);if(on)load()}show();$('#authForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b={email:f.get('email'),password:f.get('password')};if(f.get('mode')==='register')b.organization=f.get('organization');try{let d=await api('/api/auth/'+f.get('mode'),{method:'POST',body:JSON.stringify(b)});localStorage.slaToken=d.access_token;show()}catch(x){alert(x.message)}};$('#ticketForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/tickets',{method:'POST',body:JSON.stringify({subject:f.get('subject'),customer:f.get('customer'),assignee:f.get('assignee'),priority:f.get('priority'),status:'open',opened_at:new Date(f.get('opened')).toISOString(),due_at:new Date(f.get('due')).toISOString(),description:f.get('description')})});e.target.reset();load()}catch(x){$('#error').textContent=x.message}};$('#logout').onclick=()=>{delete localStorage.slaToken;show()}</script></body></html>
