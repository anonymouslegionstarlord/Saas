<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FleetLedger</title><style>
:root{font-family:Inter,system-ui;color:#232a31;background:#f4f5f2}*{box-sizing:border-box}body{margin:0}header{background:#24372d;color:white;padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}header h1{margin:0}button{background:#d26532;color:white;border:0;font-weight:700;cursor:pointer}header button{width:auto;background:#f6d56b;color:#24372d}main{max-width:1120px;margin:30px auto;padding:0 20px}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px}.panel,article{background:white;padding:18px;border-radius:15px;box-shadow:0 8px 28px #23332a10}input,select,button{width:100%;padding:10px;margin:5px 0;border:1px solid #d5dbd6;border-radius:8px;font:inherit}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stats span{background:white;border-radius:12px;padding:15px}.stats b{display:block;font-size:1.4rem}.vehicle{margin-bottom:14px}.vehicle h3{margin:0}.top,.fuel{display:flex;justify-content:space-between;gap:12px}.fuel{border-top:1px solid #e9ece8;padding:10px 0}.fuel small{display:block;color:#66736c}.alert{color:#b43d31;font-weight:700}.auth{max-width:430px;margin:10vh auto}.link{background:none;color:#d26532}.error{color:#b43d31}@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.fuel{flex-direction:column}}
</style></head><body><div id="app"></div><script>
const root=document.querySelector('#app');let token=localStorage.fleetledger||'',mode='register';const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n/100);async function api(path,opt={}){let r=await fetch('/api'+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}),d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}function auth(){root.innerHTML=`<main class="auth panel"><h1>FleetLedger</h1><p>Understand every vehicle's fuel cost and efficiency.</p><form id="auth">${mode==='register'?'<input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required>':''}<input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>${mode==='register'?'Create workspace':'Sign in'}</button></form><button id="switch" class="link">${mode==='register'?'Use an existing account':'Create a workspace'}</button><p id="error" class="error"></p></main>`;document.querySelector('#switch').onclick=()=>{mode=mode==='register'?'login':'register';auth()};document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();try{let d=await api('/auth/'+mode,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.fleetledger=token;dashboard()}catch(x){document.querySelector('#error').textContent=x.message}}}async function dashboard(){if(!token)return auth();try{let d=await api('/dashboard');root.innerHTML=`<header><div><h1>FleetLedger</h1><small>Fuel and efficiency workspace</small></div><button id="out">Sign out</button></header><main><div class="stats"><span>Vehicles<b>${d.summary.vehicles}</b></span><span>Efficiency alerts<b>${d.summary.low_efficiency}</b></span><span>Total fuel cost<b>${money(d.summary.total_cost_cents)}</b></span></div><div class="layout"><form class="panel" id="vehicle"><h2>Add vehicle</h2><input name="registration" placeholder="Registration" required><input name="label" placeholder="Vehicle label" required><select name="fuel_type"><option>diesel</option><option>petrol</option><option>cng</option></select><input name="efficiency_floor" type="number" min="0.1" step="0.1" value="12" required><button>Add vehicle</button></form><section>${d.vehicles.map(v=>`<article class="vehicle"><div class="top"><div><h3>${v.registration} · ${v.label}</h3><small>${v.fuel_type} · target ${v.efficiency_floor} km/l</small></div>${v.low_efficiency?'<span class="alert">Low efficiency</span>':''}</div>${v.logs.slice(0,4).map(l=>`<div class="fuel"><span>${l.filled_on} · ${l.driver}<small>${l.litres} L · ${money(l.cost_cents)}${l.note?' · '+l.note:''}</small></span><b>${l.efficiency===null?'Baseline':l.efficiency+' km/l'}</b></div>`).join('')}<form class="logForm" data-id="${v.id}"><input name="filled_on" type="date" required><input name="odometer_km" type="number" min="0" step="0.1" placeholder="Odometer km" required><input name="litres" type="number" min="0.01" step="0.01" placeholder="Litres" required><input name="cost" type="number" min="0.01" step="0.01" placeholder="Cost" required><input name="driver" placeholder="Driver" required><input name="note" placeholder="Note"><button>Add fuel log</button></form></article>`).join('')||'<article>No vehicles yet.</article>'}</section></div><p id="error" class="error"></p></main>`;document.querySelector('#out').onclick=()=>{localStorage.removeItem('fleetledger');token='';auth()};document.querySelector('#vehicle').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.efficiency_floor=Number(b.efficiency_floor);try{await api('/vehicles',{method:'POST',body:JSON.stringify(b)});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}};document.querySelectorAll('.logForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(f));b.odometer_km=Number(b.odometer_km);b.litres=Number(b.litres);b.cost_cents=Math.round(Number(b.cost)*100);delete b.cost;try{await api('/vehicles/'+f.dataset.id+'/fuel-logs',{method:'POST',body:JSON.stringify(b)});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}})}catch(x){localStorage.removeItem('fleetledger');token='';auth()}}dashboard();
</script></body></html>
