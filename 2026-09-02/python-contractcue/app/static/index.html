<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContractCue</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f5f6f3;color:#1d2925}header{background:#164b3c;color:#fff;padding:24px 5vw}main{max-width:1120px;margin:auto;padding:26px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.layout{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}form,.card,.stat{background:#fff;border:1px solid #dce3df;border-radius:14px;padding:18px;box-shadow:0 5px 18px #18352a0d}input,textarea,button{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #b9c8c1;border-radius:8px}button{border:0;background:#1e7258;color:#fff;font-weight:700}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}.stat{min-width:145px}.stat b{font-size:24px}.hidden{display:none}.pill{background:#dff4ea;padding:4px 8px;border-radius:99px}.muted{color:#67766f}.error{color:#b42318}@media(max-width:720px){.layout{grid-template-columns:1fr}}
</style></head><body><header><h1>ContractCue</h1><div>Never miss a promise hidden in a contract.</div></header><main>
<section id="auth"><div class="grid"><form id="register"><h2>Create workspace</h2><input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>Get started</button></form><form id="login"><h2>Sign in</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></div></section>
<section id="workspace" class="hidden"><div id="stats" class="stats"></div><div class="layout"><form id="contract"><h2>Add contract</h2><input name="title" placeholder="Agreement title" required><input name="counterparty" placeholder="Counterparty" required><input name="owner_email" type="email" placeholder="Internal owner" required><label>Starts</label><input name="starts_on" type="date" required><label>Ends</label><input name="ends_on" type="date" required><input name="value_cents" type="number" min="0" placeholder="Value in cents"><textarea name="notes" placeholder="Scope and renewal notes"></textarea><button>Add contract</button></form><section><h2>Contract register</h2><div id="contracts" class="grid"></div></section></div></section><p id="message" class="error"></p></main><script>
let token=localStorage.contractcue||'';async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function load(){if(!token)return;try{const d=await api('/api/dashboard');auth.classList.add('hidden');workspace.classList.remove('hidden');stats.innerHTML=[['Contracts',d.summary.total],['Active',d.summary.active],['Due in 14 days',d.summary.due_soon]].map(function(x){return '<div class="stat"><b>'+x[1]+'</b><div class="muted">'+x[0]+'</div></div>'}).join('');contracts.innerHTML=d.contracts.map(function(c){return '<article class="card"><span class="pill">'+c.status+'</span><h3>'+c.title+'</h3><p>'+c.counterparty+'</p><small>'+c.starts_on+' to '+c.ends_on+'</small><p>'+c.obligation_count+' obligations / '+(c.due_soon||0)+' due soon</p></article>'}).join('')||'<p class="muted">Add your first agreement.</p>'}catch(e){message.textContent=e.message;localStorage.removeItem('contractcue')}}
for(const id of ['register','login'])document.getElementById(id).onsubmit=async function(e){e.preventDefault();try{const d=await api('/api/auth/'+id,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.contractcue=token;load()}catch(x){message.textContent=x.message}};
contract.onsubmit=async function(e){e.preventDefault();try{const b=Object.fromEntries(new FormData(e.target));b.value_cents=Number(b.value_cents||0);await api('/api/contracts',{method:'POST',body:JSON.stringify(b)});e.target.reset();load()}catch(x){message.textContent=x.message}};load();
</script></body></html>
