<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrantPilot</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17223b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.bar{background:#10244b;color:white;padding:1rem 5%;display:flex;justify-content:space-between}.wrap{max-width:1050px;margin:auto;padding:2rem 1rem}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}.card{background:white;border-radius:14px;padding:1.1rem;box-shadow:0 5px 22px #19325b12}.muted{color:#64748b}.big{font-size:1.7rem;font-weight:750}form{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin:1.2rem 0}input,select,textarea,button{font:inherit;padding:.75rem;border:1px solid #cbd5e1;border-radius:9px}textarea{grid-column:1/-1}button{background:#2e62d4;color:white;border:0;cursor:pointer}.list{display:grid;gap:.7rem}.row{display:flex;justify-content:space-between;gap:1rem}.hidden{display:none}.error{color:#b42318}@media(max-width:700px){.grid,form{grid-template-columns:1fr}.row{flex-direction:column}}
</style></head><body><header class="bar"><strong>GrantPilot</strong><button id="logout" class="hidden">Log out</button></header><main class="wrap"><section id="auth" class="card"><h1>Turn funding opportunities into outcomes.</h1><p class="muted">Create your organization account or sign in.</p><form id="authForm"><input name="organization" placeholder="Organization (new accounts)"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><select name="mode"><option value="register">Create account</option><option value="login">Sign in</option></select><button>Continue</button></form></section><section id="app" class="hidden"><div class="grid" id="metrics"></div><form class="card" id="grantForm"><input name="funder" placeholder="Funder" required><input name="program" placeholder="Program" required><input name="deadline" type="date" required><input name="requested" type="number" min="1" step=".01" placeholder="Requested amount" required><input name="owner" placeholder="Owner" required><select name="status"><option>prospect</option><option>drafting</option><option>submitted</option><option>awarded</option><option>declined</option></select><textarea name="notes" placeholder="Notes"></textarea><button>Add grant</button></form><p id="error" class="error"></p><div class="list" id="grants"></div></section></main><script>
const $=s=>document.querySelector(s), token=()=>localStorage.gpToken; const money=c=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(c/100);
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(token()?{Authorization:`Bearer ${token()}`}:{})}});if(!r.ok)throw new Error((await r.json()).detail||'Request failed');return r.status===204?null:r.json()}
async function load(){try{const [grants,m]=await Promise.all([api('/api/grants'),api('/api/dashboard')]);$('#metrics').innerHTML=[['Opportunities',m.total],['Requested',money(m.requested_cents)],['Awarded',money(m.awarded_cents)],['Due in 30 days',m.due_soon]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('');$('#grants').innerHTML=grants.map(g=>`<article class="card row"><div><strong>${g.program}</strong><div class="muted">${g.funder} · ${g.owner}</div></div><div><strong>${money(g.requested_cents)}</strong><div class="muted">${g.status} · ${g.deadline}</div></div></article>`).join('')||'<div class="card muted">No opportunities yet.</div>'}catch(e){$('#error').textContent=e.message}}
function show(){const on=!!token();$('#auth').classList.toggle('hidden',on);$('#app').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on);if(on)load()}show();
$('#authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),mode=f.get('mode');try{const body={email:f.get('email'),password:f.get('password')};if(mode==='register')body.organization=f.get('organization');const r=await api(`/api/auth/${mode}`,{method:'POST',body:JSON.stringify(body)});localStorage.gpToken=r.access_token;show()}catch(err){alert(err.message)}};
$('#grantForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/grants',{method:'POST',body:JSON.stringify({funder:f.get('funder'),program:f.get('program'),deadline:f.get('deadline'),requested_cents:Math.round(Number(f.get('requested'))*100),owner:f.get('owner'),status:f.get('status'),notes:f.get('notes')})});e.target.reset();load()}catch(err){$('#error').textContent=err.message}};$('#logout').onclick=()=>{localStorage.removeItem('gpToken');show()};
</script></body></html>
