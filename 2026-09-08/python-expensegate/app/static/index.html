<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExpenseGate</title><style>
:root{font-family:Inter,system-ui;color:#15261f;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}header{background:#12372a;color:white;padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}header h1{margin:0}header button{width:auto;background:#d5f06d;color:#12372a}main{max-width:1100px;margin:32px auto;padding:0 20px}.grid{display:grid;grid-template-columns:320px 1fr;gap:24px}.panel,article{background:white;border-radius:16px;padding:20px;box-shadow:0 8px 28px #18392b12}input,select,textarea,button{width:100%;padding:11px;margin:6px 0;border:1px solid #ccd8d2;border-radius:9px;font:inherit}button{background:#176b4d;color:white;border:0;font-weight:700;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.summary b{display:block;font-size:1.25rem}.summary span{background:white;padding:16px;border-radius:12px}.expense{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e7eeea;padding:14px 0}.expense small{display:block;color:#607168}.actions{display:flex;gap:6px}.actions button{padding:8px;width:auto}.reject{background:#a83d43}.pill{font-size:.75rem;background:#e1f2ea;padding:4px 8px;border-radius:20px}.auth{max-width:430px;margin:10vh auto}.link{background:none;color:#176b4d}.error{color:#a12e36}@media(max-width:760px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.expense{flex-direction:column}}
</style></head><body><div id="app"></div><script>
const root=document.querySelector('#app');let token=localStorage.expensegate||'';let mode='register';const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n/100);async function api(path,opt={}){const r=await fetch('/api'+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}),d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}function auth(){root.innerHTML=`<main class="auth panel"><h1>ExpenseGate</h1><p>Submit, review and understand team spending.</p><form id="auth">${mode==='register'?'<input name="workspace" placeholder="Workspace" required><input name="name" placeholder="Your name" required>':''}<input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password" required><button>${mode==='register'?'Create workspace':'Sign in'}</button></form><button class="link" id="switch">${mode==='register'?'Use an existing account':'Create a workspace'}</button><p class="error" id="error"></p></main>`;document.querySelector('#switch').onclick=()=>{mode=mode==='register'?'login':'register';auth()};document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();try{let d=await api('/auth/'+mode,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.expensegate=token;dashboard()}catch(x){document.querySelector('#error').textContent=x.message}}}async function dashboard(){if(!token)return auth();try{let d=await api('/dashboard');root.innerHTML=`<header><div><h1>ExpenseGate</h1><small>Approval workspace</small></div><button id="out">Sign out</button></header><main><div class="summary"><span>Awaiting review<b>${d.summary.awaiting_review}</b></span><span>Submitted<b>${money(d.summary.submitted_cents)}</b></span><span>Approved<b>${money(d.summary.approved_cents)}</b></span></div><div class="grid"><form class="panel" id="expense"><h2>New expense</h2><input name="merchant" placeholder="Merchant" required><select name="category"><option>travel</option><option>meals</option><option>software</option><option>office</option><option>other</option></select><input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required><input name="incurred_on" type="date" required><textarea name="description" placeholder="Business purpose"></textarea><button>Submit expense</button></form><section class="panel"><h2>Expense queue</h2>${d.expenses.map(x=>`<div class="expense"><span><b>${x.merchant}</b><small>${x.category} · ${x.incurred_on} · <span class="pill">${x.status}</span></small></span><span><b>${money(x.amount_cents)}</b>${x.status==='submitted'?`<div class="actions"><button data-id="${x.id}" data-status="approved">Approve</button><button class="reject" data-id="${x.id}" data-status="rejected">Reject</button></div>`:''}</span></div>`).join('')||'<p>No expenses yet.</p>'}</section></div><p class="error" id="error"></p></main>`;document.querySelector('#out').onclick=()=>{localStorage.removeItem('expensegate');token='';auth()};document.querySelector('#expense').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.amount_cents=Math.round(Number(b.amount)*100);delete b.amount;try{await api('/expenses',{method:'POST',body:JSON.stringify(b)});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{let note=prompt('Review note');if(!note)return;try{await api('/expenses/'+b.dataset.id+'/review',{method:'PATCH',body:JSON.stringify({status:b.dataset.status,review_note:note})});dashboard()}catch(x){document.querySelector('#error').textContent=x.message}})}catch(x){if(x.message.includes('token')){localStorage.removeItem('expensegate');token='';auth()}else root.innerHTML='<p>'+x.message+'</p>'}}dashboard();
</script></body></html>
